# One entry per algorithm. 'space' defines the random-search ranges.
# Types: int [lo,hi] | float [lo,hi] | logfloat [lo,hi] | choice [values]
# 'optional: true' models are skipped (with a warning) if their library is missing.
models:
  - {name: persistence,   family: baseline, kind: persistence}
  - {name: climatology,   family: baseline, kind: climatology}
  - name: logistic
    family: baseline
    kind: logistic
    space: {C: [logfloat, 0.001, 100]}
  - name: knn
    family: simple
    kind: knn
    space: {n_neighbors: [int, 5, 80], weights: [choice, [uniform, distance]]}
  - name: naive_bayes
    family: simple
    kind: naive_bayes
  - name: svm
    family: simple
    kind: svm
    space: {C: [logfloat, 0.1, 50], gamma: [logfloat, 0.0005, 0.5]}
  - name: decision_tree
    family: simple
    kind: decision_tree
    space: {max_depth: [int, 2, 12], min_samples_leaf: [int, 5, 100]}
  - name: random_forest
    family: ensemble
    kind: random_forest
    stochastic: true
    space: {n_estimators: [int, 100, 400], max_depth: [int, 3, 16], min_samples_leaf: [int, 2, 50]}
  - name: extra_trees
    family: ensemble
    kind: extra_trees
    stochastic: true
    space: {n_estimators: [int, 100, 400], max_depth: [int, 3, 16], min_samples_leaf: [int, 2, 50]}
  - name: gradient_boosting
    family: ensemble
    kind: gradient_boosting
    stochastic: true
    space: {n_estimators: [int, 100, 300], learning_rate: [logfloat, 0.01, 0.3], max_depth: [int, 2, 5]}
  - name: xgboost
    family: ensemble
    kind: xgboost
    stochastic: true
    optional: true
    space: {n_estimators: [int, 100, 500], learning_rate: [logfloat, 0.01, 0.3], max_depth: [int, 2, 8], subsample: [float, 0.6, 1.0]}
  - name: lightgbm
    family: ensemble
    kind: lightgbm
    stochastic: true
    optional: true
    space: {n_estimators: [int, 100, 500], learning_rate: [logfloat, 0.01, 0.3], num_leaves: [int, 8, 64]}
  - name: catboost
    family: ensemble
    kind: catboost
    stochastic: true
    optional: true
    space: {iterations: [int, 100, 400], learning_rate: [logfloat, 0.01, 0.3], depth: [int, 3, 8]}
  - name: mlp
    family: neural
    kind: mlp
    stochastic: true
    space: {hidden: [choice, [32, 64, 128]], alpha: [logfloat, 0.00001, 0.01]}
  - name: lstm
    family: sequence
    kind: lstm
    stochastic: true
    optional: true
    space: {hidden: [choice, [16, 32, 64]], lr: [logfloat, 0.0005, 0.01]}
  - name: gru
    family: sequence
    kind: gru
    stochastic: true
    optional: true
    space: {hidden: [choice, [16, 32, 64]], lr: [logfloat, 0.0005, 0.01]}
  - name: cnn1d
    family: sequence
    kind: cnn1d
    stochastic: true
    optional: true
    space: {hidden: [choice, [16, 32, 64]], lr: [logfloat, 0.0005, 0.01]}
